<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>讲座报名助手（公开版）使用指引</title>
<style>body{max-width:44rem;margin:8vh auto;padding:1rem;color:#173332;background:#f3f7f6;font:17px/1.75 system-ui,sans-serif}main{border-radius:1rem;background:white;padding:2rem}h1{font-size:1.5rem}a{color:#006653}code{overflow-wrap:anywhere}</style>
</head><body><main><h1>在报名表中打开公开版助手</h1>
<ol><li>在 Edge 或 Chrome 中打开主办方发的腾讯文档填写链接，地址以 <code>https://docs.qq.com/form/page/</code> 开头。</li>
<li>安装扩展后刷新表单，点右下角「报名助手 · 公开版」。</li>
<li>输入姓名、学号和本场年级选项的完整文字，核对须知，再点「检查本页（不填写）」。点「保存本机资料」可在下次使用相同的个人资料和提交秒数。</li></ol>
<p><a href="demo.html">打开本地演练表</a>，用虚构资料练习填写和选择年级。</p></main></body></html>
